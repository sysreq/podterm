<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT Caddy</title>
<script src="/static/vendor/plotly-2.35.2.min.js"></script>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/layout.css">
<link rel="stylesheet" href="/static/css/components.css">
</head>
<body>

<header id="topnav">
  <div id="brand"><span class="brand-dot"></span>GPT Caddy</div>
  <nav id="tab-bar" role="tablist" aria-label="Views">
    <button type="button" class="tab active" role="tab" data-tab="live" aria-selected="true" aria-controls="tab-live">Live</button>
    <button type="button" class="tab" role="tab" data-tab="health" aria-selected="false" aria-controls="tab-health" tabindex="-1">Model Health</button>
    <button type="button" class="tab" role="tab" data-tab="history" aria-selected="false" aria-controls="tab-history" tabindex="-1">History</button>
    <button type="button" class="tab" role="tab" data-tab="compare" aria-selected="false" aria-controls="tab-compare" tabindex="-1">Compare</button>
    <button type="button" class="tab" role="tab" data-tab="machines" aria-selected="false" aria-controls="tab-machines" tabindex="-1">Machines</button>
  </nav>
  <div id="topnav-right">
    <div id="cluster-pill" class="status-pill"><span class="pill-dot"></span><span id="cluster-pill-text">Connecting…</span></div>
    <div id="cache-pill" class="status-pill down" title="Shared torch.compile cache (Redis pod)"><span class="pill-dot"></span><span id="cache-pill-text">Compile Cache</span></div>
    <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
    <div id="avatar">S</div>
  </div>
</header>

<aside id="sidebar">
  <div class="side-label">Actions</div>
  <div id="sidebar-actions">
    <button id="btn-launch" class="primary">Launch Run</button>
    <button id="btn-stop" class="danger">Stop Run</button>
    <button id="btn-refresh">Refresh</button>
  </div>
  <div class="side-label">Active Runs</div>
  <div id="run-list"></div>
  <div id="side-footer">
    <div id="status">Connecting…</div>
    <div id="status-sub"></div>
  </div>
</aside>

<div id="main">
  <!-- Live Tab -->
  <div id="tab-live" class="tab-content active">
    <div id="live-placeholder" class="placeholder">Select a run from the sidebar, or Launch Run to start one.</div>
    <div id="live-view">
      <div id="boot-panel">
        <div class="boot-head">
          <div>
            <div id="boot-stage"></div>
            <div id="boot-image"></div>
          </div>
          <div id="boot-counter"></div>
        </div>
        <div class="boot-bar"><div class="boot-bar-fill"></div></div>
        <div id="boot-message"></div>
        <div id="boot-layers"></div>
      </div>
      <div id="kpi-row"></div>
      <div id="race-banner">
        <div class="race-text">
          <div id="race-headline"></div>
          <div id="race-sub"></div>
        </div>
        <div class="race-progress">
          <div class="race-bar">
            <div class="race-bar-fill"></div>
            <div class="race-marker projected" title="Your budget finish"></div>
            <div class="race-marker baseline" title="Baseline budget finish"></div>
            <div class="race-marker win" title="Projected win time"></div>
          </div>
          <div class="race-bar-labels">
            <span id="race-label-projected"></span>
            <span id="race-label-baseline"></span>
          </div>
        </div>
      </div>
      <div id="baseline-row">
        <label for="baseline-select">Baseline</label>
        <select id="baseline-select">
          <option value="">None</option>
        </select>
        <button id="baseline-pin" class="btn-ghost" title="Pin selected baseline for future runs">Pin</button>
        <span id="baseline-target"></span>
      </div>
      <div id="charts-row">
        <div class="chart-box">
          <div class="chart-header"><span class="chart-title">Training Loss</span></div>
          <div id="chart-loss" class="chart-plot"></div>
        </div>
      </div>
      <div id="diag-row"></div>
      <div id="bottom-row">
        <div id="logs-panel">
          <div class="panel-header">
            <span class="chart-title">Logs</span>
            <div id="log-tabs">
              <button class="log-tab active" data-level="all">All</button>
              <button class="log-tab" data-level="warn">Warnings</button>
              <button class="log-tab" data-level="error">Errors</button>
              <button class="log-tab" data-level="metric">Metrics</button>
            </div>
            <input id="log-filter" placeholder="Filter…" spellcheck="false">
            <button id="log-pause" title="Pause autoscroll">Pause</button>
          </div>
          <div id="log-lines"></div>
          <button id="log-resume" hidden>Resume ▼ <span id="log-new-count">0</span> new</button>
        </div>
        <div id="config-panel">
          <div class="panel-header"><span class="chart-title">Config / Repro</span></div>
          <div id="config-rows"></div>
          <button id="btn-full-config" class="btn-ghost">View Full Config (JSON)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Model Health Tab -->
  <div id="tab-health" class="tab-content">
    <div id="health-root"></div>
  </div>

  <!-- History Tab -->
  <div id="tab-history" class="tab-content">
    <input id="history-filter" placeholder="Filter by branch or GPU...">
    <div id="history-actions">
      <button id="btn-compare-selected">Compare Selected</button>
      <button id="btn-clear-selection">Clear</button>
      <span id="selection-count">0 selected</span>
    </div>
    <div id="history-table-area"></div>
  </div>

  <!-- Compare Tab -->
  <div id="tab-compare" class="tab-content">
    <div id="compare-placeholder" class="placeholder">Select runs from History tab, then click Compare.</div>
    <div id="compare-selection" style="display:none"></div>
    <div id="compare-regression"></div>
    <div id="compare-controls"></div>
    <div id="compare-charts"></div>
    <div id="compare-health"></div>
    <div id="compare-summary"></div>
  </div>

  <!-- Machines Tab -->
  <div id="tab-machines" class="tab-content">
    <div id="machines-table-area"><div class="placeholder">No pods.</div></div>
  </div>
</div>

<!-- Launch Dialog -->
<dialog id="launch-dialog">
  <h3>Launch Run</h3>
  <form id="launch-form" method="dialog">
  <label for="f-branch">Branch</label>
  <select id="f-branch"></select>
  <label for="f-dc">Datacenter</label>
  <select id="f-dc"></select>
  <label for="f-gpu">GPU</label>
  <select id="f-gpu"></select>
  <label for="f-variant">Data Variant</label>
  <select id="f-variant"></select>
  <label for="f-shards">Data shards</label>
  <input id="f-shards" type="number" value="20" min="1">
  <details>
    <summary>Advanced</summary>
    <label for="f-name">Name (optional)</label>
    <input id="f-name" placeholder="defaults to branch name">
    <label for="f-gpu-count">GPU count</label>
    <input id="f-gpu-count" type="number" value="1" min="1" max="8">
    <label for="f-train-script">Train script</label>
    <input id="f-train-script" value="train_gpt.py">
    <label for="f-profile">Profile steps (0 = disabled)</label>
    <input id="f-profile" type="number" value="0" min="0">
    <div class="chk-row"><input type="checkbox" id="f-compile-debug"><label for="f-compile-debug" style="margin:0">Compile graph debug</label></div>
    <div class="chk-row"><input type="checkbox" id="f-graph-logs"><label for="f-graph-logs" style="margin:0">Graph logs</label></div>
    <label for="f-time">Time budget (sec)</label>
    <input id="f-time" type="number" value="600" min="60">
    <label for="f-data-repo">Data HF repo</label>
    <input id="f-data-repo" value="sysrekt/parameter-golf">
    <label for="f-data-version">Data version (HF revision)</label>
    <input id="f-data-version" value="main">
    <label for="f-redis">Redis cache server (ip:port)</label>
    <input id="f-redis" placeholder="e.g. 10.0.0.5:6379">
  </details>
  <div class="btn-row">
    <button type="submit" id="btn-do-launch" class="primary">Launch Run</button>
    <button type="button" id="btn-launch-cancel">Cancel</button>
  </div>
  </form>
</dialog>

<!-- Full Config Dialog -->
<dialog id="config-dialog">
  <h3>Full Config (JSON)</h3>
  <pre id="config-json"></pre>
  <div class="btn-row">
    <button id="btn-config-close">Close</button>
  </div>
</dialog>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
