<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PodTerm v2.0</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/layout.css">
<link rel="stylesheet" href="/static/css/components.css">
</head>
<body>

<div id="sidebar">
  <h2>PodTerm</h2>
  <div id="pod-list"></div>
  <div id="sidebar-actions">
    <button id="btn-launch">Launch</button>
    <button id="btn-stop" class="danger">Stop</button>
    <button id="btn-refresh">Refresh</button>
  </div>
  <div id="status">Loading...</div>
</div>

<div id="main">
  <div id="tab-bar">
    <div class="tab active" data-tab="live">Live</div>
    <div class="tab" data-tab="history">History</div>
    <div class="tab" data-tab="compare">Compare</div>
  </div>

  <!-- Live Tab -->
  <div id="tab-live" class="tab-content active">
    <div id="live-placeholder" class="placeholder">Select a running pod or launch a new experiment.</div>
    <div id="live-info" style="display:none"></div>
    <div id="live-baseline" style="display:none;margin-bottom:8px">
      <label style="font-size:12px;color:var(--text-muted);margin-right:8px">Baseline:</label>
      <select id="baseline-select" style="padding:4px 8px;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:12px;width:300px">
        <option value="">None</option>
      </select>
    </div>
    <div id="live-charts" style="display:none">
      <div class="chart-box chart-wide">
        <div id="chart-loss-header" style="display:flex;align-items:baseline;padding:4px 8px 0;font-size:13px">
          <span id="diff-loss" style="margin-right:8px"></span>
          <span style="color:var(--text-secondary);font-weight:600;flex:1;text-align:center">Training Loss</span>
          <span id="diff-time" style="margin-left:8px"></span>
        </div>
        <div id="chart-loss"></div>
      </div>
    </div>
    <div id="log-viewer" style="display:none"></div>
  </div>

  <!-- History Tab -->
  <div id="tab-history" class="tab-content">
    <input id="history-filter" placeholder="Filter by branch or GPU...">
    <div id="history-actions">
      <button id="btn-compare-selected">Compare Selected</button>
      <button id="btn-clear-selection">Clear</button>
      <span id="selection-count">0 selected</span>
      <span style="margin-left: auto"></span>
      <button id="btn-import-logs">Import Logs</button>
    </div>
    <div id="history-table-area"></div>
  </div>

  <!-- Compare Tab -->
  <div id="tab-compare" class="tab-content">
    <div id="compare-placeholder" class="placeholder">Select runs from History tab, then click Compare.</div>
    <div id="compare-selection" style="display:none"></div>
    <div id="compare-charts"></div>
    <div id="compare-summary"></div>
  </div>
</div>

<!-- Launch Dialog -->
<dialog id="launch-dialog">
  <h3>Launch Experiment</h3>
  <label>Branch</label>
  <select id="f-branch"></select>
  <label>Datacenter</label>
  <select id="f-dc"></select>
  <label>GPU</label>
  <select id="f-gpu"></select>
  <label>Data Variant</label>
  <select id="f-variant"></select>
  <label>Data shards</label>
  <input id="f-shards" type="number" value="20" min="1">
  <details>
    <summary>Advanced</summary>
    <label>Name (optional)</label>
    <input id="f-name" placeholder="defaults to branch name">
    <label>GPU count</label>
    <input id="f-gpu-count" type="number" value="1" min="1" max="8">
    <label>Train script</label>
    <input id="f-train-script" value="train_gpt.py">
    <label>Profile steps (0 = disabled)</label>
    <input id="f-profile" type="number" value="0" min="0">
    <div class="chk-row"><input type="checkbox" id="f-compile-debug"><label style="margin:0">Compile graph debug</label></div>
    <div class="chk-row"><input type="checkbox" id="f-graph-logs"><label style="margin:0">Graph logs</label></div>
    <label>Time budget (sec)</label>
    <input id="f-time" type="number" value="600" min="60">
    <label>Data HF repo</label>
    <input id="f-data-repo" value="sysrekt/parameter-golf">
    <label>Data version (HF revision)</label>
    <input id="f-data-version" value="main">
    <label>Redis cache server (ip:port)</label>
    <input id="f-redis" placeholder="e.g. 10.0.0.5:6379">
  </details>
  <div class="btn-row">
    <button id="btn-do-launch" class="primary">Launch</button>
    <button id="btn-launch-cancel">Cancel</button>
  </div>
</dialog>

<!-- Import Logs Dialog -->
<dialog id="import-dialog">
  <h3>Import Log Files</h3>
  <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Scan .cache/logs/ and .local/examples/ for training logs to import into the database.</p>
  <div id="import-list" style="max-height:400px;overflow-y:auto"></div>
  <div class="btn-row">
    <button id="btn-import-all" class="primary">Import All</button>
    <button id="btn-import-close">Close</button>
  </div>
</dialog>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
