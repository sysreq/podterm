[project]
name = "gpt-caddy"
version = "2.0.0"
description = "RunPod GPU training experiment manager"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
gpt-caddy = "podterm.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Quality gate, deliberately non-disruptive: tuned to pass on the current tree
# without reformatting. Widen scope only on purpose (see per-file relaxations).
line-length = 140
target-version = "py312"
# pod-image/ holds deployment artifacts that run on the RunPod pod (e.g. the
# stdlib event daemon), not application code — vendored in gpt-golf's dense style.
# Exclude it from the app's lint gate (same spirit as the diagnostics relaxations).
extend-exclude = ["pod-image"]

[tool.ruff.lint]
# pycodestyle errors (E), pyflakes (F), and import-sorting (I) — a high-value,
# low-noise subset. F catches real bugs (unused/undefined names).
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The diagnostics package is single-sourced from the sibling gpt-golf checkout
# (see CLAUDE.md) and intentionally mirrors that upstream's dense, compact
# style — multi-statement lines, long lines, terse single-letter locals. Relax
# those stylistic checks here to preserve the vendored layout; correctness
# rules (undefined names, real import errors, etc.) still apply.
"podterm/diagnostics/**" = ["E401", "E501", "E701", "E702", "E741", "F401", "I001"]
# Test modules use compact, semicolon-joined setup lines for readability.
"tests/**" = ["E701", "E702", "I001"]
# Two pre-existing import-ordering nits in otherwise-clean modules, left as-is
# to keep this gate additive. Remove these once the imports are re-sorted.
"podterm/config.py" = ["I001"]
"podterm/eventing/poller.py" = ["I001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution is "gpt-caddy" but the import package stays "podterm" (the
# rebrand kept the module name), so tell hatchling where the package lives —
# otherwise it would look for a "gpt_caddy" dir and fail to build.
[tool.hatch.build.targets.wheel]
packages = ["podterm"]
